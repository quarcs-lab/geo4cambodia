[project]
name = "geo4cambodia"
version = "0.1.0"
description = "GeoDevelopment Observatory of Cambodia: open indicators, tools, and insights for monitoring sustainable regional development"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Carlos Mendez"},
    {name = "Theara Khoun"},
    {name = "Ate Poortinga"},
]

dependencies = [
    # Core data science
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    # Visualization
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.15",
    # Spatial analysis
    "geopandas>=0.14",
    "contextily>=1.4",
    "rasterio>=1.3",
    "libpysal>=4.9",
    "mapclassify>=2.6",
    "esda>=2.5",
    "splot>=1.1",
    "mgwr>=2.2",
    "inequality>=1.0",
    # Econometrics
    "statsmodels>=0.14",
    # Jupyter
    "jupyter>=1.0",
    "notebook>=7.0",
    "jupytext>=1.19.1",
]

[project.urls]
Homepage = "https://quarcs-lab.github.io/geo4cambodia/"
Repository = "https://github.com/quarcs-lab/geo4cambodia"

[tool.uv]
package = false
constraint-dependencies = [
    "numba>=0.60,<0.62",
    "llvmlite>=0.44,<0.45",
]
